[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "m4-core"
version = "1.0.0"
description = "A modular Discord bot with economy, moderation, fun, utility, AI chat, and web panel"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "immie & nyx"},
]
keywords = ["discord", "bot", "discord-py", "economy", "moderation"]

dependencies = [
    "discord.py>=2.3.0,<3.0.0",
    "aiohttp>=3.9.0,<4.0.0",
    "groq>=0.4.0,<1.0.0",
    "pyyaml>=6.0,<7.0",
    "qrcode[pil]>=7.4,<8.0",
    "Pillow>=10.0,<11.0",
    "deep-translator>=1.9,<2.0",
    "requests>=2.31,<3.0",
    "msgpack>=1.0,<2.0",
    "pyfiglet>=1.0,<2.0",
    "python-dotenv>=1.0,<2.0",
]

[project.urls]
Repository = "https://github.com/immie/m4-core"

[tool.setuptools.packages.find]
include = ["commands*", "helpers*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.msgpack"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["commands", "helpers"]
omit = ["*/venv/*", "*/tests/*"]
